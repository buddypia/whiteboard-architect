<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 620" width="1050" height="620">
  <defs>
    <linearGradient id="dpBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#161922"/>
    </linearGradient>
    <marker id="dpArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4b5563"/>
    </marker>
    <marker id="dpArrowG" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>

  <style>
    .dp { font-family: 'Inter', 'Segoe UI', sans-serif; }
    .dpTitle { font-size: 20px; font-weight: 700; fill: #f3f4f6; }
    .dpSub { font-size: 11px; fill: #6b7280; letter-spacing: 1.5px; font-weight: 500; }
    .dpPhase { font-size: 12px; font-weight: 700; fill: #f3f4f6; }
    .dpNum { font-size: 16px; font-weight: 800; }
    .dpDesc { font-size: 11px; fill: #d1d5db; }
    .dpDetail { font-size: 10px; fill: #9ca3af; }
    .dpMono { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #6ee7b7; }
    .dpCmd { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; fill: #a78bfa; }
  </style>

  <rect width="1050" height="620" fill="url(#dpBg)" rx="12"/>

  <!-- Title -->
  <text x="525" y="38" text-anchor="middle" class="dp dpTitle">Deployment Pipeline  (6 Phases)</text>
  <text x="525" y="56" text-anchor="middle" class="dp dpSub">./deploy.sh --project YOUR_PROJECT_ID --region us-central1</text>

  <!-- ===== PHASE 1: Setup ===== -->
  <rect x="30" y="80" width="155" height="200" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="55" cy="105" r="14" fill="#1e40af" opacity="0.3"/>
  <text x="55" y="111" text-anchor="middle" class="dp dpNum" fill="#60a5fa">1</text>
  <text x="80" y="108" class="dp dpPhase" fill="#60a5fa">Setup</text>

  <text x="45" y="140" class="dp dpDesc">gcloud auth check</text>
  <text x="45" y="158" class="dp dpDesc">Project config</text>
  <text x="45" y="176" class="dp dpDesc">Docker registry auth</text>
  <line x1="45" y1="188" x2="170" y2="188" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="45" y="205" class="dp dpDetail">Verify credentials</text>
  <text x="45" y="220" class="dp dpDetail">Set region/project</text>
  <text x="45" y="235" class="dp dpDetail">Configure AR auth</text>
  <text x="45" y="258" class="dp dpMono">gcloud config set</text>

  <!-- Arrow 1->2 -->
  <line x1="185" y1="180" x2="210" y2="180" stroke="#4b5563" stroke-width="1.5" marker-end="url(#dpArrow)"/>

  <!-- ===== PHASE 2: Infrastructure ===== -->
  <rect x="215" y="80" width="155" height="200" rx="10" fill="#1c2a20" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="240" cy="105" r="14" fill="#065f46" opacity="0.3"/>
  <text x="240" y="111" text-anchor="middle" class="dp dpNum" fill="#34d399">2</text>
  <text x="265" y="108" class="dp dpPhase" fill="#34d399">Infra</text>

  <text x="230" y="140" class="dp dpDesc">Enable GCP APIs</text>
  <text x="230" y="158" class="dp dpDesc">Artifact Registry</text>
  <text x="230" y="176" class="dp dpDesc">Service Account</text>
  <text x="230" y="194" class="dp dpDesc">Firestore DB</text>
  <text x="230" y="212" class="dp dpDesc">Cloud Storage</text>
  <line x1="230" y1="222" x2="355" y2="222" stroke="#065f46" stroke-width="0.5"/>
  <text x="230" y="240" class="dp dpMono">terraform apply</text>
  <text x="230" y="258" class="dp dpDetail">(targeted resources)</text>

  <!-- Arrow 2->3 -->
  <line x1="370" y1="180" x2="395" y2="180" stroke="#4b5563" stroke-width="1.5" marker-end="url(#dpArrow)"/>

  <!-- ===== PHASE 3: Backend Build ===== -->
  <rect x="400" y="80" width="155" height="200" rx="10" fill="#271f10" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="425" cy="105" r="14" fill="#78350f" opacity="0.3"/>
  <text x="425" y="111" text-anchor="middle" class="dp dpNum" fill="#fbbf24">3</text>
  <text x="450" y="108" class="dp dpPhase" fill="#fbbf24">BE Build</text>

  <text x="415" y="140" class="dp dpDesc">Docker build</text>
  <text x="415" y="158" class="dp dpDesc">Push to AR</text>
  <line x1="415" y1="172" x2="540" y2="172" stroke="#78350f" stroke-width="0.5"/>
  <text x="415" y="192" class="dp dpDetail">Python + FastAPI</text>
  <text x="415" y="210" class="dp dpDetail">+ ADK + Gemini SDK</text>
  <text x="415" y="228" class="dp dpDetail">+ PIL + services</text>
  <text x="415" y="258" class="dp dpMono">docker build ./backend</text>

  <!-- Arrow 3->4 -->
  <line x1="555" y1="180" x2="580" y2="180" stroke="#4b5563" stroke-width="1.5" marker-end="url(#dpArrow)"/>

  <!-- ===== PHASE 4: Backend Deploy ===== -->
  <rect x="585" y="80" width="155" height="200" rx="10" fill="#1f1a2e" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="610" cy="105" r="14" fill="#4c1d95" opacity="0.3"/>
  <text x="610" y="111" text-anchor="middle" class="dp dpNum" fill="#a78bfa">4</text>
  <text x="635" y="108" class="dp dpPhase" fill="#a78bfa">BE Deploy</text>

  <text x="600" y="140" class="dp dpDesc">Cloud Run deploy</text>
  <text x="600" y="158" class="dp dpDesc">Session affinity ON</text>
  <text x="600" y="176" class="dp dpDesc">Public IAM</text>
  <line x1="600" y1="188" x2="725" y2="188" stroke="#4c1d95" stroke-width="0.5"/>
  <text x="600" y="208" class="dp dpDetail">2 CPU / 2 Gi</text>
  <text x="600" y="226" class="dp dpDetail">Timeout: 3600s</text>
  <text x="600" y="244" class="dp dpDetail">Env: API_KEY, GCS</text>
  <text x="600" y="266" class="dp dpMono">terraform apply</text>

  <!-- Arrow 4->5 -->
  <line x1="740" y1="180" x2="765" y2="180" stroke="#4b5563" stroke-width="1.5" marker-end="url(#dpArrow)"/>

  <!-- ===== PHASE 5: Frontend Build ===== -->
  <rect x="770" y="80" width="125" height="200" rx="10" fill="#271f10" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="795" cy="105" r="14" fill="#78350f" opacity="0.3"/>
  <text x="795" y="111" text-anchor="middle" class="dp dpNum" fill="#fbbf24">5</text>
  <text x="820" y="108" class="dp dpPhase" fill="#fbbf24">FE Build</text>

  <text x="785" y="140" class="dp dpDesc">Docker build</text>
  <text x="785" y="158" class="dp dpDesc">Inject BE URL</text>
  <text x="785" y="176" class="dp dpDesc">Push to AR</text>
  <line x1="785" y1="188" x2="880" y2="188" stroke="#78350f" stroke-width="0.5"/>
  <text x="785" y="208" class="dp dpDetail">Next.js standalone</text>
  <text x="785" y="226" class="dp dpDetail">WS_URL injected</text>
  <text x="785" y="258" class="dp dpMono">docker build</text>

  <!-- Arrow 5->6 -->
  <line x1="895" y1="180" x2="920" y2="180" stroke="#4b5563" stroke-width="1.5" marker-end="url(#dpArrow)"/>

  <!-- ===== PHASE 6: Frontend Deploy ===== -->
  <rect x="925" y="80" width="100" height="200" rx="10" fill="#1c2a20" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="950" cy="105" r="14" fill="#065f46" opacity="0.3"/>
  <text x="950" y="111" text-anchor="middle" class="dp dpNum" fill="#34d399">6</text>
  <text x="975" y="108" class="dp dpPhase" fill="#34d399">FE Deploy</text>

  <text x="940" y="140" class="dp dpDesc">Cloud Run</text>
  <text x="940" y="158" class="dp dpDesc">deploy</text>
  <text x="940" y="176" class="dp dpDesc">Final apply</text>
  <line x1="940" y1="188" x2="1010" y2="188" stroke="#065f46" stroke-width="0.5"/>
  <text x="940" y="208" class="dp dpDetail">1 CPU / 512Mi</text>
  <text x="940" y="226" class="dp dpDetail">Public access</text>
  <text x="940" y="258" class="dp dpMono">terraform</text>
  <text x="940" y="272" class="dp dpMono">apply (all)</text>

  <!-- ===== Terraform Resources ===== -->
  <rect x="30" y="310" width="995" height="120" rx="10" fill="#111318" stroke="#1f2937" stroke-width="1"/>
  <text x="50" y="335" class="dp dpPhase" fill="#f59e0b">TERRAFORM RESOURCES (infra/terraform/main.tf)</text>

  <!-- Resource boxes -->
  <rect x="50" y="348" width="135" height="65" rx="6" fill="#271f10" stroke="#d97706" stroke-width="0.8"/>
  <text x="118" y="368" text-anchor="middle" class="dp dpDesc" fill="#fbbf24">GCP APIs (6)</text>
  <text x="118" y="385" text-anchor="middle" class="dp dpDetail">run, firestore,</text>
  <text x="118" y="400" text-anchor="middle" class="dp dpDetail">storage, AR, build, IAM</text>

  <rect x="200" y="348" width="135" height="65" rx="6" fill="#271f10" stroke="#d97706" stroke-width="0.8"/>
  <text x="268" y="368" text-anchor="middle" class="dp dpDesc" fill="#fbbf24">Artifact Registry</text>
  <text x="268" y="385" text-anchor="middle" class="dp dpDetail">Docker format</text>
  <text x="268" y="400" text-anchor="middle" class="dp dpDetail">whiteboard-architect</text>

  <rect x="350" y="348" width="135" height="65" rx="6" fill="#271f10" stroke="#d97706" stroke-width="0.8"/>
  <text x="418" y="368" text-anchor="middle" class="dp dpDesc" fill="#fbbf24">Service Account</text>
  <text x="418" y="385" text-anchor="middle" class="dp dpDetail">Firestore User</text>
  <text x="418" y="400" text-anchor="middle" class="dp dpDetail">Storage Admin</text>

  <rect x="500" y="348" width="110" height="65" rx="6" fill="#271f10" stroke="#d97706" stroke-width="0.8"/>
  <text x="555" y="368" text-anchor="middle" class="dp dpDesc" fill="#fbbf24">Firestore</text>
  <text x="555" y="385" text-anchor="middle" class="dp dpDetail">Native mode</text>
  <text x="555" y="400" text-anchor="middle" class="dp dpDetail">(default) DB</text>

  <rect x="625" y="348" width="110" height="65" rx="6" fill="#271f10" stroke="#d97706" stroke-width="0.8"/>
  <text x="680" y="368" text-anchor="middle" class="dp dpDesc" fill="#fbbf24">GCS Bucket</text>
  <text x="680" y="385" text-anchor="middle" class="dp dpDetail">30-day lifecycle</text>
  <text x="680" y="400" text-anchor="middle" class="dp dpDetail">force_destroy</text>

  <rect x="750" y="348" width="130" height="65" rx="6" fill="#1f1a2e" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="815" y="368" text-anchor="middle" class="dp dpDesc" fill="#a78bfa">Cloud Run BE</text>
  <text x="815" y="385" text-anchor="middle" class="dp dpDetail">2CPU/2Gi, affinity</text>
  <text x="815" y="400" text-anchor="middle" class="dp dpDetail">timeout 3600s</text>

  <rect x="895" y="348" width="115" height="65" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="953" y="368" text-anchor="middle" class="dp dpDesc" fill="#60a5fa">Cloud Run FE</text>
  <text x="953" y="385" text-anchor="middle" class="dp dpDetail">1CPU/512Mi</text>
  <text x="953" y="400" text-anchor="middle" class="dp dpDetail">standalone Next.js</text>

  <!-- ===== Output ===== -->
  <rect x="30" y="450" width="995" height="60" rx="10" fill="#0f2818" stroke="#065f46" stroke-width="1"/>
  <text x="50" y="475" class="dp dpPhase" fill="#10b981">DEPLOYMENT OUTPUT</text>
  <text x="50" y="497" class="dp dpMono">Frontend: https://whiteboard-frontend-xxxxx.run.app</text>
  <text x="500" y="497" class="dp dpMono">Backend: https://whiteboard-backend-xxxxx.run.app</text>

  <!-- ===== Quick Commands ===== -->
  <rect x="30" y="530" width="475" height="70" rx="10" fill="#111318" stroke="#1f2937" stroke-width="1"/>
  <text x="50" y="555" class="dp dpPhase" fill="#6b7280">LOCAL DEVELOPMENT</text>
  <text x="50" y="577" class="dp dpCmd">$ cp .env.example .env  &amp;&amp;  docker-compose up --build</text>
  <text x="50" y="592" class="dp dpDetail">Frontend :3000  |  Backend :8080  |  Hot reload enabled</text>

  <rect x="530" y="530" width="495" height="70" rx="10" fill="#111318" stroke="#1f2937" stroke-width="1"/>
  <text x="550" y="555" class="dp dpPhase" fill="#6b7280">CLOUD DEPLOYMENT</text>
  <text x="550" y="577" class="dp dpCmd">$ ./deploy.sh --project my-project --region us-central1</text>
  <text x="550" y="592" class="dp dpDetail">6-phase pipeline: setup -> infra -> BE build -> BE deploy -> FE build -> FE deploy</text>
</svg>
