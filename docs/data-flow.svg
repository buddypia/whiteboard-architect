<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06080d"/>
      <stop offset="100%" style="stop-color:#0f1729"/>
    </linearGradient>
    <linearGradient id="em2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="bl2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="pu2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="am2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="cy2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="re2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <filter id="sh2">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="a2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="a2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="a2p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/>
    </marker>
    <marker id="a2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="a2c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#06b6d4"/>
    </marker>
    <marker id="a2r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="a2w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2e8f0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="880" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">Whiteboard Architect — Data Flow Diagram</text>
  <text x="600" y="62" text-anchor="middle" fill="#64748b" font-size="13">Real-time Multimodal Streaming Architecture</text>

  <!-- ========== ROW 1: INPUT SOURCES ========== -->
  <text x="60" y="105" fill="#94a3b8" font-size="12" font-weight="600" text-transform="uppercase" letter-spacing="2">INPUT SOURCES</text>

  <!-- Microphone -->
  <rect x="60" y="118" width="150" height="70" rx="10" fill="#0f1729" stroke="#10b981" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="135" y="148" text-anchor="middle" fill="#10b981" font-size="12" font-weight="600">Microphone</text>
  <text x="135" y="168" text-anchor="middle" fill="#64748b" font-size="10">PCM16 mono 16kHz</text>

  <!-- Camera -->
  <rect x="240" y="118" width="150" height="70" rx="10" fill="#0f1729" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="315" y="148" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="600">Camera</text>
  <text x="315" y="168" text-anchor="middle" fill="#64748b" font-size="10">640x480 JPEG 1fps</text>

  <!-- Text Input -->
  <rect x="420" y="118" width="150" height="70" rx="10" fill="#0f1729" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="495" y="148" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="600">Text Input</text>
  <text x="495" y="168" text-anchor="middle" fill="#64748b" font-size="10">User message</text>

  <!-- UI Controls -->
  <rect x="600" y="118" width="150" height="70" rx="10" fill="#0f1729" stroke="#ef4444" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="675" y="148" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="600">UI Controls</text>
  <text x="675" y="168" text-anchor="middle" fill="#64748b" font-size="10">save_snapshot etc.</text>

  <!-- ========== ROW 2: FRONTEND PROCESSING ========== -->
  <text x="60" y="230" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="2">FRONTEND PROCESSING</text>

  <!-- Audio Capture -->
  <rect x="60" y="244" width="200" height="80" rx="10" fill="#0f1729" stroke="#10b981" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="160" y="270" text-anchor="middle" fill="#10b981" font-size="11" font-weight="600">useAudioCapture</text>
  <text x="160" y="288" text-anchor="middle" fill="#64748b" font-size="9">AudioWorklet -> float32ToInt16()</text>
  <text x="160" y="303" text-anchor="middle" fill="#64748b" font-size="9">-> base64 encode -> WS send</text>

  <!-- Video Capture -->
  <rect x="290" y="244" width="200" height="80" rx="10" fill="#0f1729" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="390" y="270" text-anchor="middle" fill="#3b82f6" font-size="11" font-weight="600">useVideoCapture</text>
  <text x="390" y="288" text-anchor="middle" fill="#64748b" font-size="9">canvas.drawImage()</text>
  <text x="390" y="303" text-anchor="middle" fill="#64748b" font-size="9">-> toDataURL("image/jpeg", 0.7)</text>

  <!-- WebSocket -->
  <rect x="520" y="244" width="200" height="80" rx="10" fill="#0f1729" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="620" y="268" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="600">useWebSocket</text>
  <text x="620" y="286" text-anchor="middle" fill="#64748b" font-size="9">Exponential backoff reconnect</text>
  <text x="620" y="301" text-anchor="middle" fill="#64748b" font-size="9">Backpressure: skip if > 64KB</text>

  <!-- Audio Playback -->
  <rect x="750" y="244" width="200" height="80" rx="10" fill="#0f1729" stroke="#8b5cf6" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="850" y="268" text-anchor="middle" fill="#8b5cf6" font-size="11" font-weight="600">useAudioPlayback</text>
  <text x="850" y="286" text-anchor="middle" fill="#64748b" font-size="9">Gapless sequential scheduling</text>
  <text x="850" y="301" text-anchor="middle" fill="#64748b" font-size="9">Barge-in: 400ms grace period</text>

  <!-- SessionApp -->
  <rect x="980" y="244" width="180" height="80" rx="10" fill="#0f1729" stroke="#06b6d4" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="1070" y="268" text-anchor="middle" fill="#06b6d4" font-size="11" font-weight="600">SessionApp</text>
  <text x="1070" y="286" text-anchor="middle" fill="#64748b" font-size="9">Event routing + State</text>
  <text x="1070" y="301" text-anchor="middle" fill="#64748b" font-size="9">Transcript / Notes / Mood</text>

  <!-- Input -> Frontend arrows -->
  <line x1="135" y1="190" x2="135" y2="242" stroke="#10b981" stroke-width="1.5" marker-end="url(#a2g)"/>
  <line x1="315" y1="190" x2="370" y2="242" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a2b)"/>
  <line x1="495" y1="190" x2="580" y2="242" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#a2a)"/>
  <line x1="675" y1="190" x2="640" y2="242" stroke="#ef4444" stroke-width="1.5" marker-end="url(#a2r)"/>

  <!-- Frontend internal arrows -->
  <line x1="262" y1="284" x2="288" y2="284" stroke="#10b981" stroke-width="1.2" marker-end="url(#a2g)" stroke-dasharray="4,2"/>
  <line x1="492" y1="284" x2="518" y2="284" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#a2b)" stroke-dasharray="4,2"/>

  <!-- ========== ROW 3: WEBSOCKET TRANSPORT ========== -->
  <rect x="60" y="360" width="1100" height="50" rx="10" fill="#1e293b" opacity="0.5" filter="url(#sh2)"/>
  <text x="600" y="390" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">WebSocket Transport — ws://backend/ws/{userId}/{sessionId}</text>

  <!-- Arrows through WebSocket -->
  <line x1="160" y1="326" x2="160" y2="358" stroke="#10b981" stroke-width="2" marker-end="url(#a2g)"/>
  <text x="175" y="348" fill="#10b981" font-size="8">{type:"audio"}</text>

  <line x1="390" y1="326" x2="390" y2="358" stroke="#3b82f6" stroke-width="2" marker-end="url(#a2b)"/>
  <text x="405" y="348" fill="#3b82f6" font-size="8">{type:"video"}</text>

  <line x1="850" y1="358" x2="850" y2="326" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a2p)"/>
  <text x="865" y="348" fill="#8b5cf6" font-size="8">{type:"audio"}</text>

  <line x1="1070" y1="358" x2="1070" y2="326" stroke="#06b6d4" stroke-width="2" marker-end="url(#a2c)"/>
  <text x="1005" y="348" fill="#06b6d4" font-size="8">{type:"transcript"}</text>

  <!-- ========== ROW 4: BACKEND PROCESSING ========== -->
  <text x="60" y="445" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="2">BACKEND PROCESSING (4 PARALLEL TASKS)</text>

  <!-- Upstream Task -->
  <rect x="60" y="458" width="240" height="90" rx="10" fill="#0f1729" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="180" y="482" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="600">upstream_task</text>
  <text x="180" y="500" text-anchor="middle" fill="#64748b" font-size="9">Audio: PCM -> Blob -> LiveRequestQueue</text>
  <text x="180" y="515" text-anchor="middle" fill="#64748b" font-size="9">Video: JPEG -> Blob -> LiveRequestQueue</text>
  <text x="180" y="530" text-anchor="middle" fill="#64748b" font-size="9">Text/Control -> Content -> Queue</text>

  <!-- WhiteboardAnalyzer (Perception Layer) -->
  <rect x="60" y="560" width="240" height="50" rx="10" fill="#0f1729" stroke="#06b6d4" stroke-width="1" stroke-dasharray="5,3" filter="url(#sh2)"/>
  <text x="180" y="582" text-anchor="middle" fill="#22d3ee" font-size="10" font-weight="600">WhiteboardAnalyzer (Perception Layer)</text>
  <text x="180" y="598" text-anchor="middle" fill="#64748b" font-size="9">gemini-3.1-flash-lite every 10s -> context inject</text>

  <!-- LiveRequestQueue -->
  <rect x="340" y="458" width="180" height="90" rx="10" fill="#0f1729" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="430" y="484" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="600">LiveRequestQueue</text>
  <text x="430" y="505" text-anchor="middle" fill="#64748b" font-size="9">Multiplexes audio,</text>
  <text x="430" y="518" text-anchor="middle" fill="#64748b" font-size="9">video, text into</text>
  <text x="430" y="531" text-anchor="middle" fill="#64748b" font-size="9">single stream</text>

  <!-- ADK Runner -->
  <rect x="560" y="458" width="180" height="90" rx="10" fill="#0f1729" stroke="#10b981" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="650" y="482" text-anchor="middle" fill="#10b981" font-size="12" font-weight="600">ADK Runner</text>
  <text x="650" y="502" text-anchor="middle" fill="#64748b" font-size="9">runner.run_live()</text>
  <text x="650" y="518" text-anchor="middle" fill="#64748b" font-size="9">Event stream processing</text>
  <text x="650" y="534" text-anchor="middle" fill="#64748b" font-size="9">Function call handling</text>

  <!-- Downstream Task -->
  <rect x="780" y="458" width="240" height="90" rx="10" fill="#0f1729" stroke="#8b5cf6" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="900" y="482" text-anchor="middle" fill="#8b5cf6" font-size="12" font-weight="600">downstream_task</text>
  <text x="900" y="500" text-anchor="middle" fill="#64748b" font-size="9">Audio -> base64 -> WS {type:"audio"}</text>
  <text x="900" y="515" text-anchor="middle" fill="#64748b" font-size="9">Transcript -> WS {type:"transcript"}</text>
  <text x="900" y="530" text-anchor="middle" fill="#64748b" font-size="9">Tool/Annotation/State -> WS</text>

  <!-- Recovery Task -->
  <rect x="780" y="560" width="240" height="50" rx="10" fill="#0f1729" stroke="#ef4444" stroke-width="1" stroke-dasharray="5,3" filter="url(#sh2)"/>
  <text x="900" y="582" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">recovery_task</text>
  <text x="900" y="598" text-anchor="middle" fill="#64748b" font-size="9">Session health monitor + false barge-in detection</text>

  <!-- Backend arrows -->
  <line x1="160" y1="412" x2="160" y2="456" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a2b)"/>
  <line x1="900" y1="456" x2="900" y2="412" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#a2p)"/>
  <line x1="302" y1="503" x2="338" y2="503" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#a2a)"/>
  <line x1="522" y1="503" x2="558" y2="503" stroke="#10b981" stroke-width="1.5" marker-end="url(#a2g)"/>
  <line x1="742" y1="503" x2="778" y2="503" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#a2p)"/>

  <!-- ========== ROW 5: GEMINI + TOOLS ========== -->
  <text x="60" y="650" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="2">AI MODEL + TOOLS</text>

  <!-- Gemini Live API -->
  <rect x="60" y="664" width="320" height="100" rx="10" fill="#0f1729" stroke="#8b5cf6" stroke-width="2" filter="url(#sh2)"/>
  <rect x="60" y="664" width="320" height="30" rx="10" fill="url(#pu2)" opacity="0.8"/>
  <text x="220" y="684" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Gemini Live API (Bidi-Streaming)</text>
  <text x="220" y="714" text-anchor="middle" fill="#c4b5fd" font-size="10">Model: gemini-2.5-flash-native-audio-preview-09-2025</text>
  <text x="220" y="732" text-anchor="middle" fill="#c4b5fd" font-size="10">Voice: Aoede | Language: English</text>
  <text x="220" y="750" text-anchor="middle" fill="#94a3b8" font-size="9">Input: Audio + Video + Text | Output: Audio + Text + Function Calls</text>

  <!-- Arrow Runner <-> Gemini -->
  <line x1="650" y1="550" x2="350" y2="662" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a2p)"/>
  <line x1="300" y1="662" x2="600" y2="550" stroke="#10b981" stroke-width="2" marker-end="url(#a2g)"/>

  <!-- Agent Archie -->
  <rect x="420" y="664" width="200" height="100" rx="10" fill="#0f1729" stroke="#10b981" stroke-width="1.5" filter="url(#sh2)"/>
  <rect x="420" y="664" width="200" height="30" rx="10" fill="url(#em2)" opacity="0.8"/>
  <text x="520" y="684" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Agent "Archie"</text>
  <text x="520" y="712" text-anchor="middle" fill="#34d399" font-size="10">Senior Cloud Architect</text>
  <text x="520" y="730" text-anchor="middle" fill="#64748b" font-size="9">5 Categories Review:</text>
  <text x="520" y="748" text-anchor="middle" fill="#64748b" font-size="9">Security / Scalability / Reliability</text>
  <text x="520" y="762" text-anchor="middle" fill="#64748b" font-size="9">Cost / Operations</text>

  <!-- Tools -->
  <rect x="660" y="664" width="190" height="100" rx="10" fill="#0f1729" stroke="#ef4444" stroke-width="1.5" filter="url(#sh2)"/>
  <rect x="660" y="664" width="190" height="30" rx="10" fill="url(#re2)" opacity="0.8"/>
  <text x="755" y="684" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">ADK Tools (3)</text>
  <text x="755" y="712" text-anchor="middle" fill="#fca5a5" font-size="9">save_whiteboard_snapshot</text>
  <text x="755" y="730" text-anchor="middle" fill="#fca5a5" font-size="9">save_review_note</text>
  <text x="755" y="748" text-anchor="middle" fill="#fca5a5" font-size="9">generate_diagram</text>

  <!-- Cloud Services -->
  <rect x="890" y="664" width="130" height="100" rx="10" fill="#0f1729" stroke="#06b6d4" stroke-width="1.5" filter="url(#sh2)"/>
  <rect x="890" y="664" width="130" height="30" rx="10" fill="url(#cy2)" opacity="0.8"/>
  <text x="955" y="684" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Firestore</text>
  <text x="955" y="712" text-anchor="middle" fill="#67e8f9" font-size="9">sessions/</text>
  <text x="955" y="728" text-anchor="middle" fill="#67e8f9" font-size="9">  snapshots/</text>
  <text x="955" y="744" text-anchor="middle" fill="#67e8f9" font-size="9">  notes/</text>

  <rect x="1040" y="664" width="130" height="100" rx="10" fill="#0f1729" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh2)"/>
  <rect x="1040" y="664" width="130" height="30" rx="10" fill="url(#am2)" opacity="0.8"/>
  <text x="1105" y="684" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Cloud Storage</text>
  <text x="1105" y="712" text-anchor="middle" fill="#fbbf24" font-size="9">{session_id}/</text>
  <text x="1105" y="728" text-anchor="middle" fill="#fbbf24" font-size="9">  snapshots/*.jpg</text>

  <!-- Tool -> Cloud arrows -->
  <line x1="852" y1="730" x2="888" y2="730" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#a2c)" stroke-dasharray="5,3"/>
  <line x1="852" y1="715" x2="1038" y2="715" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#a2a)" stroke-dasharray="5,3"/>

  <!-- Agent -> Tools arrow -->
  <line x1="622" y1="720" x2="658" y2="720" stroke="#ef4444" stroke-width="1.5" marker-end="url(#a2r)"/>

  <!-- ========== DATA FORMAT LEGEND ========== -->
  <rect x="60" y="790" width="1110" height="70" rx="10" fill="#0f1729" stroke="#1e293b" stroke-width="1" filter="url(#sh2)"/>
  <text x="600" y="815" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Data Formats</text>

  <rect x="90" y="828" width="12" height="12" rx="2" fill="#10b981"/>
  <text x="108" y="839" fill="#94a3b8" font-size="10">Audio In: PCM16 16kHz base64</text>

  <rect x="300" y="828" width="12" height="12" rx="2" fill="#3b82f6"/>
  <text x="318" y="839" fill="#94a3b8" font-size="10">Video: JPEG 640x480 base64</text>

  <rect x="510" y="828" width="12" height="12" rx="2" fill="#8b5cf6"/>
  <text x="528" y="839" fill="#94a3b8" font-size="10">Audio Out: PCM 24kHz base64</text>

  <rect x="730" y="828" width="12" height="12" rx="2" fill="#f59e0b"/>
  <text x="748" y="839" fill="#94a3b8" font-size="10">Control: JSON messages</text>

  <rect x="930" y="828" width="12" height="12" rx="2" fill="#06b6d4"/>
  <text x="948" y="839" fill="#94a3b8" font-size="10">Persistence: Firestore/GCS</text>
</svg>
